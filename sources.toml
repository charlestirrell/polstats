# Data sources fetched by:  PYTHONPATH=src uv run python -P -m polstats.fetch
# Raw files land in raw/<source>/ and are git-ignored: this manifest, not the data, is what we version.
#
# Dataverse files are pinned by file id (a new dataset version gets new ids) and verified against the
# MD5 that Dataverse publishes for the ORIGINAL uploaded file (`original = true` => ?format=original).
# Mutable sources (updated upstream) have no checksum; the loaders record a content hash as Provenance.

[[source]]
name = "congress-legislators"
description = "Members of Congress 1789-present (current file): names, terms, party, cross-reference IDs"
homepage = "https://github.com/unitedstates/congress-legislators"
license = "CC0-1.0 (as reported by the project; verify)"
mutable = true

  [[source.file]]
  url = "https://unitedstates.github.io/congress-legislators/legislators-current.json"
  dest = "legislators-current.json"

