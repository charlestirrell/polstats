services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: polstats
      POSTGRES_PASSWORD: polstats_dev
      POSTGRES_DB: polstats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polstats"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
